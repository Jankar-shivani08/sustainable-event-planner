{% extends 'base.html' %}

{% block title %}Verify Your Email{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="auth-card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="auth-card__header text-center py-4 px-4">
                    <div class="auth-icon mb-3">✉️</div>
                    <h2 class="mb-1">Verify Your Email</h2>
                    <p class="mb-0 text-white-50">OTP sent to: <strong>{{ masked_email }}</strong></p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        <input type="hidden" name="email" value="{{ email }}">

                        <div class="mb-3">
                            <label for="otp" class="form-label">Enter 6-digit OTP</label>
                            <input
                                id="otp"
                                type="text"
                                name="otp"
                                class="form-control form-control-lg text-center fs-3"
                                maxlength="6"
                                inputmode="numeric"
                                pattern="[0-9]{6}"
                                placeholder="123456"
                                autocomplete="one-time-code"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2">Verify OTP</button>
                    </form>

                    <form method="post" action="{% url 'accounts:resend_otp' %}" class="mt-3">
                        {% csrf_token %}
                        <input type="hidden" name="email" value="{{ email }}">
                        <button id="resendOtpBtn" type="submit" class="btn btn-outline-secondary w-100" disabled>
                            Resend OTP in <span id="countdownText">00:60</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const resendBtn = document.getElementById('resendOtpBtn');
    const countdownText = document.getElementById('countdownText');
    let remainingSeconds = 60;

    function updateCountdown() {
        const minutes = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
        const seconds = (remainingSeconds % 60).toString().padStart(2, '0');
        countdownText.textContent = `${minutes}:${seconds}`;

        if (remainingSeconds <= 0) {
            resendBtn.disabled = false;
            resendBtn.innerHTML = 'Resend OTP';
            return;
        }

        remainingSeconds -= 1;
    }

    updateCountdown();
    const timer = setInterval(() => {
        if (remainingSeconds <= 0) {
            clearInterval(timer);
            return;
        }
        updateCountdown();
    }, 1000);
</script>
{% endblock %}
