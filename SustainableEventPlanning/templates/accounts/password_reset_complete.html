{% extends 'base.html' %}

{% block title %}Password Changed{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="auth-card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="auth-card__header text-center py-4 px-4">
                    <div class="auth-icon mb-3">✅</div>
                    <h2 class="mb-1">Password Changed</h2>
                    <p class="mb-0 text-white-50">Your password has been reset successfully</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <p>You can now log in with your new password.</p>
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 py-2 mt-2">Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
